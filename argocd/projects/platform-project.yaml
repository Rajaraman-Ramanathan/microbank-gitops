apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Microbank Platform Components

  sourceRepos:
  - https://github.com/Rajaraman-Ramanathan/microbank-gitops.git
  - https://charts.bitnami.com/bitnami

  destinations:
  - namespace: '*'
    server: https://kubernetes.default.svc

  clusterResourceWhitelist:
  - group: '*'
    kind: '*'

  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'