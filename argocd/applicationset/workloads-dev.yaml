apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workloads
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/Rajaraman-Ramanathan/microbank-gitops.git
        revision: dev
        directories:
          - path: workloads/services/*
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: workloads
      source:
        repoURL: https://github.com/Rajaraman-Ramanathan/microbank-gitops.git
        targetRevision: dev
        path: workloads/charts/microservice-base
        helm:
          valueFiles:
            - '../../services/{{path.basename}}/values-dev.yaml'
      destination:
        server: https://microbank-dev-control-plane:6443
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true