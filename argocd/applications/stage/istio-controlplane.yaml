apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: YOUR_REPO
    targetRevision: main
    path: platform/service-mesh/istio/control-plane/helm
    helm:
      valueFiles:
      - values-stage.yaml
  destination:
    name: eks-stage
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true