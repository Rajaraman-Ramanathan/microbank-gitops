apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  sources:
  - repoURL: https://charts.bitnami.com/bitnami
    chart: minio
    targetRevision: 17.0.1
    helm:
      releaseName: minio
      valueFiles:
        - $values/platform/shared-infra/storage/minio/values-dev.yaml
  - repoURL: https://github.com/Rajaraman-Ramanathan/microbank-gitops.git
    targetRevision: dev
  destination:
    server: https://kubernetes.default.svc
    namespace: minio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true