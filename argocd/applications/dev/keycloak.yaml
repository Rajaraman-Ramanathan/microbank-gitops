apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: platform
  sources:
  - repoURL: https://charts.bitnami.com/bitnami
    chart: keycloak                               
    targetRevision: 24.3.0 
    helm:
      releaseName: keycloak
      valueFiles:
        - $values/platform/security/keycloak/values-dev.yaml
  - repoURL: https://github.com/Rajaraman-Ramanathan/microbank-gitops.git
    targetRevision: dev
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true