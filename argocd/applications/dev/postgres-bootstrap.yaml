apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-bootstrap-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: <YOUR_GIT_REPO_URL>
    targetRevision: HEAD
    path: platform/bootstrap/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  syncPolicy:
    automated:
      prune: true
      selfHeal: true