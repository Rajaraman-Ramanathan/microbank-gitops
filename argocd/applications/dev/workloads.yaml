apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workloads-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: workloads
  source:
    repoURL: https://github.com/Rajaraman-Ramanathan/microbank-gitops.git
    targetRevision: dev
    path: workloads
  destination:
    server: https://microbank-dev-control-plane:6443
    namespace: microbank-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true