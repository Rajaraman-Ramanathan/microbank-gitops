apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: <YOUR_REPO_URL>
    targetRevision: HEAD
    path: platform/bootstrap/namespaces
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true