apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: microbank-dev
  labels:
    app: keycloak
spec:
  replicas: 1   # DEV only
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:22.0.1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: KEYCLOAK_ADMIN
          value: admin
        - name: KEYCLOAK_ADMIN_PASSWORD
          value: admin
        - name: KC_HTTP_ENABLED
          value: "true"
        - name: KC_HOSTNAME
          value: auth.microbank.local
        - name: KC_HOSTNAME_STRICT
          value: "false"
        args:
        - start-dev
        - --import-realm
        volumeMounts:
        - name: keycloak-realm
          mountPath: /opt/keycloak/data/import
      volumes:
      - name: keycloak-realm
        configMap:
          name: keycloak-realm-config
