apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: microbank-dev
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:4.2.4-management-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5672   # AMQP
        - containerPort: 15672  # Management UI
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /api/healthchecks/node
            port: 15672
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /api/healthchecks/node
            port: 15672
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 5
