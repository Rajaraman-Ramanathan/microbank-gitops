apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
data:
  SPRING_PROFILES_ACTIVE: docker
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth-service:5432/auth_db
  SPRING_DATASOURCE_USERNAME: auth_db
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  KEYCLOAK_TOKEN_URL: http://auth.microbank.local/realms/microbank/protocol/openid-connect/token
  KEYCLOAK_GRANT_TYPE: password
  KEYCLOAK_CLIENT_ID: microbank-client
  KEYCLOAK_SERVER_URL: http://auth.microbank.local
  KEYCLOAK_REALM: master
  KEYCLOAK_ADMIN_CLIENT_ID: admin-cli
  KEYCLOAK_ADMIN_USERNAME: admin