nameOverride: "document-service"
fullnameOverride: "document-service"
replicaCount: 1
global:
  component: backend
image:
  repository: 65486509/document-service
  tag: "1.0.39"
  pullPolicy: Always
service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8084
serviceAccount:
  create: true
  name: "document-service-sa"
  automount: false
  annotations: {}
podLabels:
  network-role: backend
  access.postgres: "true"
  access.minio: "true"
  access.rabbitmq: "true"
  access.keycloak: "true"
configMap:
  enabled: true
  data:
    SPRING_PROFILES_ACTIVE: docker
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-postgresql.postgres.svc.cluster.local:5432/documentdb
    SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    MINIO_ENDPOINT: http://minio.minio.svc.cluster.local:9000
    MINIO_BUCKET_NAME: transaction-documents
    SPRING_RABBITMQ_HOST: rabbitmq.rabbitmq.svc.cluster.local
    SPRING_RABBITMQ_PORT: "5672"
    SPRING_RABBITMQ_USERNAME: devuser
    SERVER_PORT: "8084"
secret:
  enabled: true
  data:
    SPRING_DATASOURCE_USERNAME: documentuser
    SPRING_DATASOURCE_PASSWORD: documentpass
    MINIO_ACCESS_KEY: devminio
    MINIO_SECRET_KEY: devminiopassword
    SPRING_RABBITMQ_PASSWORD: devpassword
resources:
  enabled: true
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 600m
    memory: 512Mi
startupProbe:
  enabled: true
  config:
    httpGet:
      path: /actuator/health/liveness
      port: 8084
    failureThreshold: 40
    periodSeconds: 5
    timeoutSeconds: 3
readinessProbe:
  enabled: true
  config:
    httpGet:
      path: /actuator/health/readiness
      port: 8084
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
livenessProbe:
  enabled: true
  config:
    httpGet:
      path: /actuator/health/liveness
      port: 8084
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 5
affinity:
  enabled: false
topologySpreadConstraints:
  enabled: false
