nameOverride: "notification-service"
fullnameOverride: "notification-service"
replicaCount: 1
global:
  component: worker
image:
  repository: 65486509/notification-service
  tag: "1.0.43"
  pullPolicy: Always
service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: management
      port: 8095
      targetPort: management
containerPorts:
  http: 8085
  management: 8095
serviceMonitor:
  enabled: false
serviceAccount:
  create: true
  name: "notification-service-sa"
  automount: false
  annotations: {}
podLabels:
  network-role: worker
  access.rabbitmq: "true"
  access.smtp: "true"
configMap:
  enabled: true
  data:
    SPRING_PROFILES_ACTIVE: docker
    SPRING_RABBITMQ_HOST: rabbitmq.rabbitmq.svc.cluster.local
    SPRING_RABBITMQ_PORT: "5672"
    SPRING_MAIL_HOST: maildev.maildev.svc.cluster.local
    SPRING_MAIL_PORT: "1025"
    SENDER_EMAIL: no-reply@microbank.co
    SERVER_PORT: "8085"
    MANAGEMENT_SERVER_PORT: "8095"
secret:
  enabled: true
  data:
    SPRING_RABBITMQ_USERNAME: devuser
    SPRING_RABBITMQ_PASSWORD: devpassword
    SPRING_MAIL_USERNAME: maildev
    SPRING_MAIL_PASSWORD: maildev
resources:
  enabled: true
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
startupProbe:
  enabled: true
  config:
    httpGet:
      path: /actuator/health/liveness
      port: management
    failureThreshold: 60
    periodSeconds: 5
    timeoutSeconds: 3
readinessProbe:
  enabled: true
  config:
    httpGet:
      path: /actuator/health/readiness
      port: management
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
livenessProbe:
  enabled: true
  config:
    httpGet:
      path: /actuator/health/liveness
      port: management
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
affinity:
  enabled: false
topologySpreadConstraints:
  enabled: false
