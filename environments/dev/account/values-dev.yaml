nameOverride: "account-service"
fullnameOverride: "account-service"
replicaCount: 1
image:
  repository: 65486509/account-service
  tag: "1.0.40"
  pullPolicy: Always
service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8082
serviceAccount:
  create: true
  name: "account-service-sa"
  automount: false
  annotations: {}
podLabels:
  network-role: backend
  access.postgres: "true"
  access.keycloak: "true"
  exposed-via-gateway: "true"
configMap:
  enabled: true
  data:
    SPRING_PROFILES_ACTIVE: docker
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-postgresql.postgres.svc.cluster.local:5432/accountdb
    SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    SERVER_PORT: "8082"
secret:
  enabled: true
  data:
    SPRING_DATASOURCE_USERNAME: accountuser
    SPRING_DATASOURCE_PASSWORD: accountpass
resources:
  enabled: true
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
startupProbe:
  enabled: true
  config:
    httpGet:
      path: /actuator/health/liveness
      port: 8082
    failureThreshold: 30
    periodSeconds: 10
    timeoutSeconds: 3
readinessProbe:
  enabled: true
  config:
    httpGet:
      path: /actuator/health/readiness
      port: 8082
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
livenessProbe:
  enabled: true
  config:
    httpGet:
      path: /actuator/health/liveness
      port: 8082
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
affinity:
  enabled: false
topologySpreadConstraints:
  enabled: false
