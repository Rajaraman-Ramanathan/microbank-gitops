nameOverride: "account-service"
fullnameOverride: "account-service"
replicaCount: 1
## image:
##  repository: 65486509/account-service
##  tag: "1.0.43"
##  pullPolicy: Always
image:
  repository: 65486509.dkr.ecr.ap-south-1.amazonaws.com/microbank/account-service
  digest: ""
  pullPolicy: IfNotPresent
service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: management
      port: 8092
      targetPort: management
containerPorts:
  http: 8082
  management: 8092
serviceMonitor:
  enabled: false
serviceAccount:
  create: true
  name: "account-service-sa"
  automount: false
  annotations: {}
podLabels:
  network-role: backend
  access.postgres: "true"
  access.keycloak: "true"
  exposed-via-gateway: "true"
configMap:
  enabled: true
  data:
    SPRING_PROFILES_ACTIVE: docker
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-postgresql.postgres.svc.cluster.local:5432/accountdb
    SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    SERVER_PORT: "8082"
    MANAGEMENT_SERVER_PORT: "8092"
secret:
  enabled: true
  data:
    SPRING_DATASOURCE_USERNAME: accountuser
    SPRING_DATASOURCE_PASSWORD: accountpass
resources:
  enabled: true
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
startupProbe:
  enabled: true
  config:
    httpGet:
      path: /actuator/health/liveness
      port: management
    failureThreshold: 30
    periodSeconds: 10
    timeoutSeconds: 3
readinessProbe:
  enabled: true
  config:
    httpGet:
      path: /actuator/health/readiness
      port: management
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
livenessProbe:
  enabled: true
  config:
    httpGet:
      path: /actuator/health/liveness
      port: management
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
affinity:
  enabled: false
topologySpreadConstraints:
  enabled: false
