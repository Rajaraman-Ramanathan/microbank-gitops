nameOverride: "apigateway-ingress"
fullnameOverride: "apigateway-ingress"
replicaCount: 1
global:
  component: gateway
image:
  repository: 65486509/apigateway-service
  tag: "1.0.41"
  pullPolicy: Always
service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8123
serviceAccount:
  create: true
  name: "apigateway-service-sa"
  automount: false
  annotations: {}
configMap:
  enabled: true
  data:
    SPRING_PROFILES_ACTIVE: docker
    SERVER_PORT: "8123"
secret:
  enabled: false
podLabels:
  network-role: gateway
  access.keycloak: "true"
resources:
  enabled: true
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
startupProbe:
  enabled: true
  config:
    httpGet:
      path: /actuator/health/liveness
      port: 8123
    failureThreshold: 60
    periodSeconds: 5
    timeoutSeconds: 3
readinessProbe:
  enabled: true
  config:
    httpGet:
      path: /actuator/health/readiness
      port: 8123
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
livenessProbe:
  enabled: true
  config:
    httpGet:
      path: /actuator/health/liveness
      port: 8123
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
affinity:
  enabled: false
topologySpreadConstraints:
  enabled: false
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: api.dev.microbankapp.com
      paths:
        - path: /api
          pathType: Prefix
