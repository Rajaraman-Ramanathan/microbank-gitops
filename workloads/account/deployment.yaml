apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  labels:
    app.kubernetes.io/name: account-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: microbank
    app.kubernetes.io/managed-by: argocd
    tier: workloads
spec:
  replicas: 1 # DEV
  selector:
    matchLabels:
      app.kubernetes.io/name: account-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: account-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: microbank
        app.kubernetes.io/managed-by: argocd
        network-role: backend
        access.postgres: "true"
        access.keycloak: "true"
        exposed-via-gateway: "true"
    spec:
      initContainers:
        - name: flyway-migrate
          image: 65486509/account-flyway:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for DB..."
              until pg_isready -h postgres-postgresql.postgres.svc.cluster.local; do
                sleep 2
              done

              flyway \
                -url=$(DB_URL) \
                -user=$(DB_USER) \
                -password=$(DB_PASSWORD) \
                -baselineOnMigrate=true \
                migrate
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: account-service-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: account-service-secret
                  key: SPRING_DATASOURCE_PASSWORD
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: account-service-config
                  key: SPRING_DATASOURCE_URL
            
      containers:
        - name: account-service
          image: 65486509/account-service:1.0.34
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: account-service-config
            - secretRef:
                name: account-service-secret
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
