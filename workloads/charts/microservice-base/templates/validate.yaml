{{/*
Chart validations
Fail early for invalid secret creation combinations
*/}}
{{- if and .Values.secret.enabled .Values.externalSecret.enabled }}
  {{- fail "secret.enabled and externalSecret.enabled cannot both be true" }}
{{- end }}

{{/*
Fail early for invalid IRSA configuration
*/}}
{{- if and .Values.irsa.enabled (empty .Values.serviceAccount.annotations) }}
  {{- fail "IRSA enabled but service account annotations missing" }}
{{- end }}

{{/*
Fail early for invalid HPA configuration
*/}}
{{- if and .Values.hpa.enabled (lt .Values.hpa.minReplicas 1) }}
  {{- fail "hpa.minReplicas must be >=1" }}
{{- end }}

{{/*
Fail early for invalid VirtualService configuration
*/}}
{{- if and .Values.virtualService.enabled (not .Values.istio.enabled) }}
  {{ fail "virtualService requires istio.enabled=true" }}
{{- end }}

{{/*
Fail early for invalid NodePort configuration
*/}}
{{- if and (eq .Values.service.type "NodePort") (empty .Values.service.nodePort) }}
  {{- fail "NodePort service requires nodePort value" }}
{{- end }}