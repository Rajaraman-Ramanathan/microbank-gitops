apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway-service
  labels:
    app.kubernetes.io/name: apigateway-service
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: microbank
    app.kubernetes.io/managed-by: argocd
    tier: workload
spec:
  replicas: 1 # DEV: single replica
  selector:
    matchLabels:
      app.kubernetes.io/name: apigateway-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apigateway-service
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: microbank
        app.kubernetes.io/managed-by: argocd
        tier: workload
        network-role: gateway
    spec:
      containers:
        - name: apigateway-service
          image: 65486509/apigateway-service:1.0.34
          imagePullPolicy: Always
          ports:
            - containerPort: 8123
          envFrom:
            - configMapRef:
                name: apigateway-service-config
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8123
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8123
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8123
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
