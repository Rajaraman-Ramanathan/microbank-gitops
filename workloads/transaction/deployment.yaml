apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  labels:
    app.kubernetes.io/name: transaction-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: microbank
    app.kubernetes.io/managed-by: argocd
    tier: workloads
spec:
  replicas: 1 # DEV
  selector:
    matchLabels:
      app.kubernetes.io/name: transaction-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transaction-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: microbank
        app.kubernetes.io/managed-by: argocd
        tier: workloads
        network-role: backend
        access.postgres: "true"
        access.rabbitmq: "true"
        access.keycloak: "true"
    spec:
      containers:
        - name: transaction-service
          image: 65486509/transaction-service:1.0.34
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: transaction-service-config
            - secretRef:
                name: transaction-service-secret
          resources:
            requests:
              cpu: "300m"
              memory: "384Mi"
            limits:
              cpu: "700m"
              memory: "768Mi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            failureThreshold: 40
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
