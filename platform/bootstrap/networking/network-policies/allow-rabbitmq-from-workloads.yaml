apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rabbitmq-from-workloads
  namespace: rabbitmq
spec:
  podSelector: {}
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: microbank-dev
    ports:
    - protocol: TCP
      port: 5672
  policyTypes:
  - Ingress