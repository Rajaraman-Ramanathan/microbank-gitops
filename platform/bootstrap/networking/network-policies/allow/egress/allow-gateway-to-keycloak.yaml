apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-keycloak
  namespace: microbank-dev
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  podSelector:
    matchLabels:
      network-role: gateway

  policyTypes:
  - Egress

  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          tier: identity
      podSelector:
        matchLabels:
          network-role: identity
          app.kubernetes.io/name: keycloak
    ports:
    - protocol: TCP
      port: 8080
