apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-transaction-service-to-document-service
  namespace: microbank-dev
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  podSelector:
    matchLabels:
      network-role: backend
      app.kubernetes.io/name: transaction-service

  policyTypes:
  - Egress

  egress:
  - to:
    - podSelector:
        matchLabels:
          network-role: backend
          app.kubernetes.io/name: document-service
    ports:
    - protocol: TCP
      port: 8084