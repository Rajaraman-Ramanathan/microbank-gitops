apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keycloak-egress-to-postgres
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  podSelector:
    matchLabels:
      network-role: identity

  policyTypes:
  - Egress

  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          tier: data
      podSelector:
        matchLabels:
          network-role: data
          app.kubernetes.io/name: postgresql
    ports:
    - protocol: TCP
      port: 5432