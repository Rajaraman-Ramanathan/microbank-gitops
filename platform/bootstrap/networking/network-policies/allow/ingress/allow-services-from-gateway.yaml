apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-from-gateway
  namespace: microbank-dev
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  podSelector:
    matchLabels:
      network-role: backend   # label all non-gateway services

  policyTypes:
  - Ingress

  ingress:
  - from:
    - podSelector:
        matchLabels:
          network-role: gateway
    ports:
    - protocol: TCP