apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-auth-from-account-service
  namespace: microbank-dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth-service

  policyTypes:
  - Ingress

  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: account-service
    ports:
    - protocol: TCP
      port: 8082