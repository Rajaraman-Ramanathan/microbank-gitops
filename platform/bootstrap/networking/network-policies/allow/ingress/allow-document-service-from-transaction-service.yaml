apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-document-service-from-transaction-service
  namespace: microbank-dev
spec:
  podSelector:
    matchLabels:
      network-role: backend
      app.kubernetes.io/name: document-service

  policyTypes:
  - Ingress

  ingress:
  - from:
    - podSelector:
        matchLabels:
          network-role: backend
          app.kubernetes.io/name: transaction-service
    ports:
    - protocol: TCP
      port: 8084