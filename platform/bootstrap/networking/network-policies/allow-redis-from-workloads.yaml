apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-tier-policy
  namespace: redis
spec:
  podSelector:
    matchLabels:
      app: app.kubernetes.io/name=redis

  policyTypes:
  - Ingress

  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          tier: workloads
      podSelector:
        matchLabels:
          app: auth-service
    ports:
    - protocol: TCP
      port: 6379