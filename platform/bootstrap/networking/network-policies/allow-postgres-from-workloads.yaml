apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-tier-policy
  namespace: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql

  policyTypes:
  - Ingress

  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          tier: workloads
    - namespaceSelector:
        matchLabels:
          tier: identity
    ports:
    - protocol: TCP
      port: 5432