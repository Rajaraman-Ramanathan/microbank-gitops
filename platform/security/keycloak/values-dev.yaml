replicas: 1

image:
  repository: quay.io/keycloak/keycloak
  tag: "24.0.3"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP

resources:
  requests:
    cpu: 300m
    memory: 512Mi
  limits:
    memory: 1Gi

extraEnv: |
  - name: KEYCLOAK_ADMIN
    valueFrom:
      secretKeyRef:
        name: keycloak-secret
        key: username
  - name: KEYCLOAK_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-secret
        key: password
  - name: KC_DB
    value: postgres
  - name: KC_DB_URL
    value: jdbc:postgresql://postgres-postgresql.postgres.svc.cluster.local:5432/keycloakdb
  - name: KC_DB_USERNAME
    value: keycloakuser
  - name: KC_DB_PASSWORD
    value: keycloakpass

extraEnvFrom: |
  - configMapRef:
      name: keycloak-config

command:
  - "/opt/keycloak/bin/kc.sh"
args:
  - "start-dev"
  - "--import-realm"

extraVolumes: |
  - name: realm-config
    configMap:
      name: keycloak-realm-config

extraVolumeMounts: |
  - name: realm-config
    mountPath: /opt/keycloak/data/import
    readOnly: true