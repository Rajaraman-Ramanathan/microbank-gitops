apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: ses-egress
  namespace: istio-system
spec:
  hosts:
  - vpce-abc.email.ap-south-1.vpce.amazonaws.com
  gateways:
  - mesh
  - egress-gateway
  tls:
  - match:
    - gateways:
      - mesh
      port: 443
      sniHosts:
      - vpce-abc.email.ap-south-1.vpce.amazonaws.com
    route:
    - destination:
        host: istio-egressgateway.istio-system.svc.cluster.local
        port:
          number: 443
  - match:
    - gateways:
      - egress-gateway
      port: 443
      sniHosts:
      - vpce-abc.email.ap-south-1.vpce.amazonaws.com
    route:
    - destination:
        host: vpce-abc.email.ap-south-1.vpce.amazonaws.com
        port:
          number: 443