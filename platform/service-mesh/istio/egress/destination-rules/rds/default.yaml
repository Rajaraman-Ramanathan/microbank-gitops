apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: rds-postgres
  namespace: istio-system
spec:
  host: microbank.cluster-xyz.ap-south-1.rds.amazonaws.com
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50