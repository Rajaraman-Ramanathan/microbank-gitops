apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: elasticache
  namespace: istio-system
spec:
  host: microbank-redis.xxxxx.cache.amazonaws.com
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 200
    outlierDetection:
      consecutive5xxErrors: 10
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50