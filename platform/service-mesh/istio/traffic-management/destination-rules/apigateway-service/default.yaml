apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: apigateway-service
  namespace: apigateway-service
spec:
  host: apigateway-service.apigateway-service.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        maxRequestsPerConnection: 20
        idleTimeout: 30s