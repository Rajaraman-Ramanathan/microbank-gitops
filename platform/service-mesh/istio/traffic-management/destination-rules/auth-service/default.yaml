apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: auth-service
  namespace: auth-service
spec:
  host: auth-service.auth-service.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        maxRequestsPerConnection: 20
        idleTimeout: 30s