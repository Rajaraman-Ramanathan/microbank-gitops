apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: apigateway-public
  namespace: apigateway-service
spec:
  gateways:
    - public-gateway
  hosts:
    - api.microbank.com
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: apigateway-service.apigateway-service.svc.cluster.local
        port:
          number: 8080
      weight: 100