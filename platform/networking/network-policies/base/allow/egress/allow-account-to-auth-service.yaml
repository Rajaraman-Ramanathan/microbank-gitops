apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-account-to-auth-service
  namespace: microbank-dev
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  podSelector:
    matchLabels:
      network-role: backend
      app.kubernetes.io/name: account-service

  policyTypes:
  - Egress

  egress:
  - to:
    - podSelector:
        matchLabels:
          network-role: backend
          app.kubernetes.io/name: auth-service
    ports:
    - protocol: TCP
      port: 8081