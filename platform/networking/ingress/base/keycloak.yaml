apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microbank-ingress
  labels:
    app.kubernetes.io/name: microbank-ingress
    app.kubernetes.io/component: routing
    app.kubernetes.io/part-of: microbank
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: microbank-ca
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - auth.microbank.local
    secretName: keycloak-tls-secret
  rules:
  - host: auth.microbank.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 80
