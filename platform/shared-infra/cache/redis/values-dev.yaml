architecture: standalone

auth:
  enabled: true
  password: devpassword

master:
  persistence:
    enabled: false
  podLabels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: microbank
    app.kubernetes.io/managed-by: argocd
    network-role: platform
    tier: platform
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
  containerSecurityContext:
    enabled: true
    runAsNonRoot: true
    allowPrivilegeEscalation: false

service:
  type: ClusterIP

networkPolicy:
  enabled: false

metrics:
  enabled: true