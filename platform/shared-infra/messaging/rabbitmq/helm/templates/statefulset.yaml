apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: rabbitmq

  template:
    metadata:
      labels:
        app: rabbitmq 
{{ toYaml .Values.podLabels | indent 8 }}

    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}

      containers:
        - name: rabbitmq
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: 5672
            - containerPort: 15672
{{- if .Values.metrics.enabled }}
            - containerPort: 15692
{{- end }}

          env:
            - name: RABBITMQ_USE_LONGNAME
              value: "false"

            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: username

            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: password

            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: erlang-cookie

          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq

          resources: {{ toYaml .Values.resources | nindent 12 }}

          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}

          startupProbe:
            httpGet:
              path: /api/health/checks/alarms
              port: 15672
              httpHeaders:
                - name: Authorization
                  value: Basic {{ printf "%s:%s" .Values.auth.username .Values.auth.password | b64enc }}
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /api/health/checks/alarms
              port: 15672
              httpHeaders:
                - name: Authorization
                  value: Basic {{ printf "%s:%s" .Values.auth.username .Values.auth.password | b64enc }}
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /api/health/checks/alarms
              port: 15672
              httpHeaders:
                - name: Authorization
                  value: Basic {{ printf "%s:%s" .Values.auth.username .Values.auth.password | b64enc }}
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30

      {{- if not .Values.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}

{{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
{{- end }}