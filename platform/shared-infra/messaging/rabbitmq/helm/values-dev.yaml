auth:
  username: devuser
  password: devpassword
  erlangCookie: devcookie

replicaCount: 1

persistence:
  enabled: false

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    memory: 512Mi

service:
  type: ClusterIP

containerSecurityContext:
  enabled: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false

metrics:
  enabled: true

networkPolicy:
  enabled: false