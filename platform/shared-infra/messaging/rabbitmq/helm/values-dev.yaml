rabbitmq:
  auth:
    username: devuser
    password: devpassword
    erlangCookie: devcookie

  replicaCount: 1

  image:
    tag: latest

  persistence:
    enabled: false

  podLabels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: microbank
    app.kubernetes.io/managed-by: argocd
    network-role: platform

  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      memory: 512Mi

  service:
    type: ClusterIP

  containerSecurityContext:
    enabled: true
    runAsNonRoot: true
    allowPrivilegeEscalation: false

  metrics:
    enabled: true

  networkPolicy:
    enabled: false